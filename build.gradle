buildscript {
    repositories {
        mavenCentral()
        google()
    }
}

plugins {
    id 'com.android.application' version '8.4.0'
    id 'org.jetbrains.kotlin.android' version '1.9.20'
}

android {
    namespace 'eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily'
    compileSdk 34
    
    defaultConfig {
        applicationId 'eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // 1. ADD SIGNING CONFIGURATION
    signingConfigs {
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'manifest-fix/AndroidManifest.xml'
            java.srcDirs = ['src/en/ishallmasterthisfamily/src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 2. LINK SIGNING TO RELEASE BUILD
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation "org.jsoup:jsoup:1.16.1"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
}