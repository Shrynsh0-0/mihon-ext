buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily"
    compileSdk 34

    defaultConfig {
        applicationId "eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'manifest-fix/AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation "org.jsoup:jsoup:1.16.1"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    
    // THE FIX: Pulls the specific stubs package that maintains the eu.kanade package prefix
    compileOnly "com.github.mihonapp:extensions-lib:8905bc9bc2"
}