buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily"
    compileSdk 33

    defaultConfig {
        applicationId "eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'manifest-fix/AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }
}

repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
}

dependencies {
    implementation "org.jsoup:jsoup:1.16.1"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    
    // THE FIX: Use capitalized MihonApp precisely so JitPack can resolve the dependency
    compileOnly "com.github.MihonApp:tachiyomix:1.6"
}