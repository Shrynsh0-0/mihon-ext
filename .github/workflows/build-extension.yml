name: Build and Deploy Single Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Script Permissions
        run: chmod +x gradlew

      - name: Build Extension (Debug Mode)
        run: ./gradlew :src:en:ishallmasterthisfamily:assembleDebug

      - name: Generate Extension Index Map
        run: |
          mkdir -p deploy/apk
          # Gathers your finished APK file and organizes it for distribution
          find src/en/ishallmasterthisfamily/build/outputs/apk/debug/ -name "*.apk" -exec cp {} deploy/apk/ \;
          
          # Generates a clean, working standalone index mapping JSON file for Mihon
          cat <<EOF > deploy/index.min.json
          [
            {
              "name": "I Shall Master This Family",
              "pkg": "eu.kanade.tachiyomi.extension.en.ishallmasterthisfamily",
              "apk": "apk/ishallmasterthisfamily-debug.apk",
              "lang": "en",
              "code": 1,
              "version": "1.4.1",
              "nsfw": 0,
              "hasReadme": false,
              "hasChangelog": false
            }
          ]
          EOF
          
          # Renames the binary safely to guarantee matching references
          mv deploy/apk/*.apk deploy/apk/ishallmasterthisfamily-debug.apk

      - name: Deploy to Live Repo Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: repo # Forces deployment onto your distinct hosting track