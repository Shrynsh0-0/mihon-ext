name: Remote Extension Builder

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile Extension APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4
      with:
        clean: true

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Using standard wrapper setup to isolate versions cleanly
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
        cache-disabled: true

    - name: Grant Execute Permission to Wrapper Script
      run: chmod +x gradlew

    - name: Clean and Build Extension Package
      run: ./gradlew clean assembleRelease --no-daemon

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mihon-Extension
        path: "**/build/outputs/apk/release/*.apk"